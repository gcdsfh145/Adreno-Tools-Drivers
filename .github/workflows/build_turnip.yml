name: Build Turnip Android Variants

on:
  workflow_dispatch:
    inputs:
      mesa_commit:
        description: 'Mesa commit to build (empty = mesa main)'
        required: false
        default: ''
        type: string
      strip_symbols:
        description: 'Strip symbols from the driver (true = smaller, but hides ICD entry used by our shim)'
        required: false
        default: false
        type: boolean
      extra_meson:
        description: 'Extra meson options, e.g. -Dplatform-sdk-version=36 -Dvulkan-beta=true (space separated)'
        required: false
        default: ''
        type: string
      platform_sdk:
        description: 'Android platform SDK version (target)'
        required: false
        default: '36'
        type: number

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mesa_commit: ${{ steps.mesa.outputs.commit }}
    steps:
      - name: Resolve Mesa commit
        id: mesa
        run: |
          if [ -n "${{ inputs.mesa_commit }}" ]; then
            COMMIT="${{ inputs.mesa_commit }}"
            test -n "$COMMIT"
          else
            COMMIT=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
            test -n "$COMMIT"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Mesa commit: $COMMIT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a6xx
            artifact: Turnip-A6xx
          - variant: a7xx
            artifact: Turnip-A7xx
          - variant: a7xx-oneui
            artifact: Turnip-A7xx-OneUI-Glitch
          - variant: a8xx-patchs2
            artifact: Turnip-A8xx-Patchs2
          - variant: a8xx-patchs1
            artifact: Turnip-A8xx-Patched-Patchs1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            patch \
            clang \
            lld \
            llvm
          pip3 install --break-system-packages meson mako

      - name: Build ${{ matrix.artifact }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: ${{ github.run_number }}
          MESA_COMMIT: ${{ needs.resolve.outputs.mesa_commit }}
          STRIP_SYMBOLS: ${{ inputs.strip_symbols }}
          MESON_EXTRA: ${{ inputs.extra_meson }}
          PLATFORM_SDK_VERSION: ${{ inputs.platform_sdk }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Verify ZIP
        run: |
          echo "Generated files:"
          find turnip_workdir -maxdepth 1 -type f -name "Turnip_*.zip" -print
          test "$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_*.zip' | wc -l)" -eq 1
          unzip -t turnip_workdir/Turnip_*.zip
          unzip -p turnip_workdir/Turnip_*.zip meta.json | python3 -m json.tool

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: turnip_workdir/Turnip_*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [resolve, build]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download drivers
        uses: actions/download-artifact@v4
        with:
          pattern: Turnip-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          ls -lah release
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -ge 1

      - name: Generate release metadata
        run: |
          echo "TAG_NAME=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Turnip Android - $(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Android/Bionic Turnip variants built from Mesa commit `${{ needs.resolve.outputs.mesa_commit }}`

            - A6xx — upstream turnip (Adreno 610/615/618/620/630/650/660/680/690)
            - A7xx — StevenMXZ
            - A7xx OneUI Glitch — StevenMXZ + 8g2 UI fix
            - A8xx Patchs2 — Patchs2 A8xx recipe
            - A8xx Patched Patchs1 — Patchs1 balanced Android recipe + 0001-0006

            Build config: strip_symbols=`${{ inputs.strip_symbols }}`, extra_meson=`${{ inputs.extra_meson }}`, platform_sdk=`${{ inputs.platform_sdk }}`
          files: release/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
